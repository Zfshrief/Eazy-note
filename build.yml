name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/eazy/note app/src/main/assets
          cp eazy-note-app.html app/src/main/assets/index.html
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'EazyNote'
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins {
            id 'com.android.application' version '8.3.2' apply false
            id 'org.jetbrains.kotlin.android' version '1.9.23' apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF
          cat > app/build.gradle <<'EOF'
          plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
          }
          android {
            namespace 'com.eazy.note'
            compileSdk 34
            defaultConfig {
              applicationId 'com.eazy.note'
              minSdk 24
              targetSdk 34
              versionCode 1
              versionName '1.0'
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.RECORD_AUDIO"/>
            <uses-permission android:name="android.permission.INTERNET"/>
            <queries>
              <intent><action android:name="android.speech.RecognitionService"/></intent>
            </queries>
            <application
              android:label="Eazy Note"
              android:icon="@android:drawable/ic_btn_speak_now"
              android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">
              <activity
                android:name=".MainActivity"
                android:exported="true"
                android:windowSoftInputMode="adjustResize"
                android:configChanges="orientation|screenSize|keyboardHidden">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/eazy/note/MainActivity.kt <<'EOF'
          package com.eazy.note

          import android.Manifest
          import android.annotation.SuppressLint
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.webkit.JavascriptInterface
          import android.webkit.WebChromeClient
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat

          class MainActivity : AppCompatActivity() {
              private lateinit var web: WebView
              private var sr: SpeechRecognizer? = null
              private var listening = false
              private var lang = "ar-EG"
              private val h = Handler(Looper.getMainLooper())

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  web = WebView(this)
                  setContentView(web)
                  web.settings.javaScriptEnabled = true
                  web.settings.domStorageEnabled = true
                  web.webViewClient = WebViewClient()
                  web.webChromeClient = WebChromeClient()
                  web.addJavascriptInterface(Bridge(), "Android")
                  web.loadUrl("file:///android_asset/index.html")
              }

              inner class Bridge {
                  @JavascriptInterface
                  fun start(l: String) {
                      runOnUiThread {
                          lang = l
                          if (ContextCompat.checkSelfPermission(this@MainActivity, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                              ActivityCompat.requestPermissions(this@MainActivity, arrayOf(Manifest.permission.RECORD_AUDIO), 1)
                          } else begin()
                      }
                  }
                  @JavascriptInterface
                  fun stop() {
                      runOnUiThread {
                          listening = false
                          h.removeCallbacksAndMessages(null)
                          sr?.cancel()
                      }
                  }
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode == 1 && grantResults.isNotEmpty() && grantResults[0] == PackageManager.PERMISSION_GRANTED) begin()
                  else { js("error", "not-allowed"); js("end", "") }
              }

              private fun js(t: String, s: String) {
                  val e = s.replace("\\", "\\\\").replace("'", "\\'").replace("\n", " ")
                  runOnUiThread { web.evaluateJavascript("window.onNative&&window.onNative('$t','$e')", null) }
              }

              private fun begin() {
                  if (!SpeechRecognizer.isRecognitionAvailable(this)) { js("error", "unavailable"); js("end", ""); return }
                  if (sr == null) {
                      sr = SpeechRecognizer.createSpeechRecognizer(this)
                      sr?.setRecognitionListener(listener)
                  }
                  listening = true
                  listen()
              }

              private fun listen() {
                  val i = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH)
                  i.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                  i.putExtra(RecognizerIntent.EXTRA_LANGUAGE, lang)
                  i.putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true)
                  sr?.startListening(i)
              }

              private val listener = object : RecognitionListener {
                  override fun onReadyForSpeech(p: Bundle?) {}
                  override fun onBeginningOfSpeech() {}
                  override fun onRmsChanged(v: Float) {}
                  override fun onBufferReceived(b: ByteArray?) {}
                  override fun onEndOfSpeech() {}
                  override fun onEvent(t: Int, p: Bundle?) {}
                  override fun onPartialResults(p: Bundle?) {
                      val t = p?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull()
                      if (!t.isNullOrEmpty()) js("partial", t)
                  }
                  override fun onResults(r: Bundle?) {
                      val t = r?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull()
                      if (!t.isNullOrEmpty()) js("final", t)
                      if (listening) h.postDelayed({ listen() }, 250)
                  }
                  override fun onError(e: Int) {
                      if (!listening) return
                      when (e) {
                          SpeechRecognizer.ERROR_NO_MATCH, SpeechRecognizer.ERROR_SPEECH_TIMEOUT -> h.postDelayed({ listen() }, 250)
                          SpeechRecognizer.ERROR_RECOGNIZER_BUSY -> { sr?.cancel(); h.postDelayed({ listen() }, 600) }
                          else -> { listening = false; js("error", "code$e"); js("end", "") }
                      }
                  }
              }

              override fun onDestroy() {
                  sr?.destroy()
                  super.onDestroy()
              }
          }
          EOF
      - name: Build
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Eazy-Note-APK
          path: app/build/outputs/apk/debug/app-debug.apk
